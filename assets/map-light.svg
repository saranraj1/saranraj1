  <circle cx="946" cy="14" r="1.5" fill="#0891b2"/>
  <circle cx="14" cy="416" r="1.5" fill="#0891b2"/>
  <circle cx="946" cy="416" r="1.5" fill="#0891b2"/>
</g>

