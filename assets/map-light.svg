<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Research Blueprint: Asymmetric technical topology across Code Intelligence, Responsible AI, AI Reliability, Agent Systems, and Verification">
<title>Research Blueprint — Topology</title>
<defs>
  <pattern id="blueprint-grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(8, 145, 178, 0.08)" stroke-width="0.75"/>
  </pattern>
  <marker id="bp-arrow-cyan-light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 2 L 7 5 L 0 8 z" fill="#0891b2"/>
  </marker>
  <marker id="bp-arrow-subtle-light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 2 L 7 5 L 0 8 z" fill="#cbd5e1"/>
  </marker>
  <marker id="bp-arrow-verify-light" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 2 L 7 5 L 0 8 z" fill="#059669"/>
  </marker>
</defs>

<!-- Outer Container -->
<rect width="960" height="430" rx="10" fill="#f6f8fb"/>
<rect width="960" height="430" rx="10" fill="url(#blueprint-grid-light)"/>
<rect x="1" y="1" width="958" height="428" rx="10" fill="none" stroke="#d5dbe5" stroke-width="1.2"/>

<!-- Major Construction Caliper Lines -->
<g stroke="rgba(8, 145, 178, 0.16)" stroke-width="1">
  <line x1="30" y1="52" x2="930" y2="52"/>
  <line x1="30" y1="190" x2="930" y2="190" stroke-dasharray="2 6"/>
  <line x1="30" y1="324" x2="930" y2="324" stroke-dasharray="2 6"/>
  <line x1="30" y1="394" x2="930" y2="394"/>
  
  <line x1="320" y1="52" x2="320" y2="394" stroke-dasharray="2 6"/>
  <line x1="640" y1="52" x2="640" y2="394" stroke-dasharray="2 6"/>
</g>

<!-- Blueprint Top Ledger Header -->
<text x="32" y="32" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#0891b2">BLUEPRINT 01 // RESEARCH TOPOLOGY</text>
<text x="440" y="32" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#94a3b8">LAB // INDEPENDENT RESEARCH</text>
<text x="928" y="32" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" font-weight="600" letter-spacing="1" fill="#64748b">SPECIMEN // SR-01</text>

